server:
  port: 8080
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_study?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:smart_study}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: ${MAIL_PROTOCOL:smtp}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}
            trust: "*"
  main:
    allow-bean-definition-overriding: true

app:
  ml-url: ${ML_SERVICE_URL:http://localhost:8000}
  upload-dir: ${UPLOAD_DIR:./uploads}
  jwt-secret: ${JWT_SECRET:local-development-secret-key-change-me-please-0123456789}
  cookie-secure: ${COOKIE_SECURE:false}
  web-origin: ${WEB_ORIGIN:http://localhost:3000}
  require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:false}
  ml-internal-token: ${ML_INTERNAL_TOKEN:dev-internal-token-change-me}
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  storage-backend: ${STORAGE_BACKEND:local}
  max-upload-mb: ${MAX_UPLOAD_MB:20}
  user-storage-quota-mb: ${USER_STORAGE_QUOTA_MB:500}
  dev-seed-enabled: ${DEV_SEED_ENABLED:false}